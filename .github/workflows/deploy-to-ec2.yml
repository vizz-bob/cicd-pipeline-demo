name: Deploy to EC2

on:
  workflow_run:
    workflows: ["Docker Image CI"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cicd-pipeline-demo:latest

      - name: Stop and remove old container
        run: |
          docker stop cicd-app || true
          docker rm cicd-app || true

      - name: Run new container
        run: docker run -d -p 8080:8080 --name cicd-app ${{ secrets.DOCKERHUB_USERNAME }}/cicd-pipeline-demo:latest
